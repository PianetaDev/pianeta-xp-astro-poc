<svg width="1440" height="900" viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg" style="background:#0f1117">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    </style>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="grad-bozza" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="grad-review" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#164e2a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d2d18;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="grad-pub" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#14532d;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#052e16;stop-opacity:1"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22c55e" opacity="0.8"/>
    </marker>
    <marker id="arrow-ver" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4ade80" opacity="0.6"/>
    </marker>
  </defs>

  <!-- Background grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
  </pattern>
  <rect width="1440" height="900" fill="url(#grid)"/>

  <!-- Top label -->
  <text x="720" y="60" text-anchor="middle" font-size="13" fill="#64748b" letter-spacing="3" font-weight="500">PAYLOAD CMS — FLUSSO DOCUMENTI</text>

  <!-- ════════ NODE 1: Bozza ════════ -->
  <rect x="140" y="160" width="300" height="420" rx="12" fill="url(#grad-bozza)" stroke="#334155" stroke-width="1.5"/>
  <!-- Status pill -->
  <rect x="168" y="185" width="80" height="24" rx="12" fill="#1e3a5f"/>
  <text x="208" y="201" text-anchor="middle" font-size="11" fill="#93c5fd" font-weight="600" letter-spacing="1">BOZZA</text>

  <!-- Doc icon -->
  <rect x="186" y="230" width="60" height="75" rx="4" fill="#1e293b" stroke="#334155"/>
  <rect x="196" y="242" width="40" height="3" rx="1.5" fill="#475569"/>
  <rect x="196" y="251" width="35" height="3" rx="1.5" fill="#475569"/>
  <rect x="196" y="260" width="40" height="3" rx="1.5" fill="#475569"/>
  <rect x="196" y="269" width="28" height="3" rx="1.5" fill="#475569"/>
  <rect x="196" y="278" width="36" height="3" rx="1.5" fill="#475569"/>
  <polygon points="226,232 246,232 246,244 234,244" fill="#0f172a" stroke="#334155"/>

  <!-- Title field -->
  <text x="290" y="248" font-size="12" fill="#64748b" font-weight="500">Titolo</text>
  <rect x="270" y="255" width="150" height="28" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="280" y="274" font-size="11" fill="#94a3b8">Rapporto clima...</text>

  <!-- Categoria field -->
  <text x="290" y="308" font-size="12" fill="#64748b" font-weight="500">Categoria</text>
  <rect x="270" y="315" width="150" height="28" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="280" y="334" font-size="11" fill="#94a3b8">Studi e ricerche ▾</text>

  <!-- File upload -->
  <text x="290" y="368" font-size="12" fill="#64748b" font-weight="500">File PDF</text>
  <rect x="270" y="375" width="150" height="40" rx="6" fill="#1e293b" stroke="#334155" stroke-dasharray="4 3"/>
  <text x="345" y="399" text-anchor="middle" font-size="11" fill="#475569">↑ Carica PDF</text>

  <!-- Cover image -->
  <text x="290" y="437" font-size="12" fill="#64748b" font-weight="500">Immagine copertina</text>
  <rect x="270" y="444" width="150" height="40" rx="6" fill="#1e293b" stroke="#334155" stroke-dasharray="4 3"/>
  <text x="345" y="468" text-anchor="middle" font-size="11" fill="#475569">↑ Carica immagine</text>

  <!-- Save bozza btn -->
  <rect x="168" y="510" width="244" height="36" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="290" y="533" text-anchor="middle" font-size="13" fill="#94a3b8" font-weight="500">Salva bozza</text>

  <!-- Footer label -->
  <text x="290" y="568" text-anchor="middle" font-size="11" fill="#475569">Visibile solo agli admin</text>

  <!-- ════════ ARROW bozza → review ════════ -->
  <line x1="440" y1="380" x2="540" y2="380" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow)" opacity="0.8"/>
  <text x="490" y="365" text-anchor="middle" font-size="11" fill="#4ade80" font-weight="600">Invia a revisione</text>

  <!-- ════════ NODE 2: In revisione ════════ -->
  <rect x="540" y="160" width="360" height="420" rx="12" fill="url(#grad-review)" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="568" y="185" width="120" height="24" rx="12" fill="#14532d"/>
  <text x="628" y="201" text-anchor="middle" font-size="11" fill="#86efac" font-weight="600" letter-spacing="1">IN REVISIONE</text>

  <!-- AI Abstract section -->
  <rect x="568" y="225" width="304" height="110" rx="8" fill="#0d2d18" stroke="#16a34a" stroke-width="1"/>
  <text x="720" y="248" text-anchor="middle" font-size="12" fill="#4ade80" font-weight="600">✦ Abstract generato dall'AI</text>
  <rect x="580" y="258" width="280" height="3" rx="1.5" fill="#166534" opacity="0.6"/>
  <rect x="580" y="268" width="280" height="3" rx="1.5" fill="#166534" opacity="0.6"/>
  <rect x="580" y="278" width="255" height="3" rx="1.5" fill="#166534" opacity="0.6"/>
  <rect x="580" y="288" width="270" height="3" rx="1.5" fill="#166534" opacity="0.6"/>
  <rect x="580" y="298" width="240" height="3" rx="1.5" fill="#166534" opacity="0.6"/>
  <text x="580" y="325" font-size="10" fill="#4ade80" opacity="0.7">Generato automaticamente · Modificabile</text>

  <!-- Metadata enrichment -->
  <text x="568" y="362" font-size="12" fill="#64748b" font-weight="500">Tag automatici</text>
  <rect x="568" y="370" width="80" height="22" rx="11" fill="#14532d" stroke="#16a34a"/>
  <text x="608" y="385" text-anchor="middle" font-size="10" fill="#86efac">clima</text>
  <rect x="658" y="370" width="80" height="22" rx="11" fill="#14532d" stroke="#16a34a"/>
  <text x="698" y="385" text-anchor="middle" font-size="10" fill="#86efac">biodiversità</text>
  <rect x="748" y="370" width="90" height="22" rx="11" fill="#14532d" stroke="#16a34a"/>
  <text x="793" y="385" text-anchor="middle" font-size="10" fill="#86efac">green city</text>

  <!-- Versioning trail -->
  <text x="568" y="420" font-size="12" fill="#64748b" font-weight="500">Versioni</text>
  <rect x="568" y="428" width="304" height="22" rx="4" fill="#0d2d18"/>
  <circle cx="580" cy="439" r="3" fill="#22c55e"/>
  <text x="590" y="443" font-size="10" fill="#4ade80">v3 · bozza attuale</text>
  <circle cx="700" cy="439" r="3" fill="#475569"/>
  <text x="710" y="443" font-size="10" fill="#64748b">v2 · 28/07</text>
  <circle cx="760" cy="439" r="3" fill="#475569"/>
  <text x="770" y="443" font-size="10" fill="#64748b">v1 · 16/07</text>

  <!-- Review actions -->
  <rect x="568" y="470" width="140" height="36" rx="8" fill="#15803d" stroke="#16a34a"/>
  <text x="638" y="493" text-anchor="middle" font-size="13" fill="#fff" font-weight="600">✓ Approva</text>
  <rect x="722" y="470" width="140" height="36" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="792" y="493" text-anchor="middle" font-size="13" fill="#94a3b8" font-weight="500">← Rimanda</text>

  <text x="720" y="568" text-anchor="middle" font-size="11" fill="#475569">Visibile solo agli editor con permesso</text>

  <!-- ════════ ARROW review → pub ════════ -->
  <line x1="900" y1="380" x2="1000" y2="380" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow)" opacity="0.8"/>
  <text x="950" y="365" text-anchor="middle" font-size="11" fill="#4ade80" font-weight="600">Pubblica</text>

  <!-- ════════ NODE 3: Pubblicato ════════ -->
  <rect x="1000" y="160" width="300" height="420" rx="12" fill="url(#grad-pub)" stroke="#22c55e" stroke-width="2" filter="url(#glow)"/>
  <rect x="1028" y="185" width="110" height="24" rx="12" fill="#15803d"/>
  <text x="1083" y="201" text-anchor="middle" font-size="11" fill="#bbf7d0" font-weight="600" letter-spacing="1">PUBBLICATO</text>

  <!-- Live indicator -->
  <circle cx="1028" cy="235" r="5" fill="#22c55e">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="1042" y="239" font-size="11" fill="#4ade80" font-weight="500">Visibile su susdef.pianeta.green</text>

  <!-- Document card preview -->
  <rect x="1028" y="258" width="244" height="130" rx="8" fill="#052e16" stroke="#16a34a"/>
  <!-- Thumbnail -->
  <rect x="1028" y="258" width="244" height="65" rx="8" fill="#0d4d22"/>
  <text x="1150" y="298" text-anchor="middle" font-size="24" fill="#22c55e" opacity="0.4">📄</text>
  <!-- Card content -->
  <rect x="1040" y="332" width="160" height="4" rx="2" fill="#15803d"/>
  <rect x="1040" y="342" width="130" height="3" rx="1.5" fill="#166534"/>
  <rect x="1040" y="351" width="145" height="3" rx="1.5" fill="#166534"/>
  <text x="1040" y="375" font-size="10" fill="#4ade80">ENERGIA E CLIMA · PDF 3.2 MB</text>

  <!-- Version history live -->
  <text x="1028" y="415" font-size="12" fill="#64748b" font-weight="500">Cronologia versioni</text>
  <rect x="1028" y="423" width="244" height="80" rx="6" fill="#052e16" stroke="#16a34a" stroke-width="0.5"/>

  <circle cx="1045" cy="440" r="4" fill="#22c55e"/>
  <line x1="1045" y1="444" x2="1045" y2="455" stroke="#166534" stroke-width="1.5"/>
  <circle cx="1045" cy="459" r="4" fill="#166534"/>
  <line x1="1045" y1="463" x2="1045" y2="474" stroke="#166534" stroke-width="1.5"/>
  <circle cx="1045" cy="478" r="4" fill="#166534"/>

  <text x="1060" y="444" font-size="10" fill="#4ade80" font-weight="600">v3 · pubblicata ora · live ●</text>
  <text x="1060" y="463" font-size="10" fill="#64748b">v2 · 28/07/26 · archiviata</text>
  <text x="1060" y="482" font-size="10" fill="#64748b">v1 · 16/07/26 · archiviata</text>

  <!-- Unpublish btn -->
  <rect x="1028" y="515" width="244" height="36" rx="8" fill="#052e16" stroke="#16a34a"/>
  <text x="1150" y="538" text-anchor="middle" font-size="12" fill="#4ade80" font-weight="500">Archivia / Nuova versione</text>

  <text x="1150" y="568" text-anchor="middle" font-size="11" fill="#475569">Indicizzato · Feed RSS · API pubblica</text>

  <!-- ════════ BOTTOM: Legend ════════ -->
  <rect x="140" y="640" width="1160" height="180" rx="12" fill="#0a0e14" stroke="#1e293b"/>
  <text x="720" y="672" text-anchor="middle" font-size="13" fill="#475569" letter-spacing="2" font-weight="500">FEATURES DEL CMS (PAYLOAD)</text>

  <!-- Feature 1 -->
  <rect x="180" y="690" width="240" height="100" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <text x="300" y="712" text-anchor="middle" font-size="20">🤖</text>
  <text x="300" y="732" text-anchor="middle" font-size="12" fill="#e2e8f0" font-weight="600">Abstract AI</text>
  <text x="300" y="749" text-anchor="middle" font-size="10" fill="#64748b">Generazione automatica</text>
  <text x="300" y="762" text-anchor="middle" font-size="10" fill="#64748b">dell'abstract al caricamento</text>
  <text x="300" y="775" text-anchor="middle" font-size="10" fill="#64748b">del PDF · modificabile</text>

  <!-- Feature 2 -->
  <rect x="450" y="690" width="240" height="100" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <text x="570" y="712" text-anchor="middle" font-size="20">📋</text>
  <text x="570" y="732" text-anchor="middle" font-size="12" fill="#e2e8f0" font-weight="600">Versioning</text>
  <text x="570" y="749" text-anchor="middle" font-size="10" fill="#64748b">Ogni modifica crea</text>
  <text x="570" y="762" text-anchor="middle" font-size="10" fill="#64748b">una versione · rollback</text>
  <text x="570" y="775" text-anchor="middle" font-size="10" fill="#64748b">istantaneo a versioni prev.</text>

  <!-- Feature 3 -->
  <rect x="720" y="690" width="240" height="100" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <text x="840" y="712" text-anchor="middle" font-size="20">🏷️</text>
  <text x="840" y="732" text-anchor="middle" font-size="12" fill="#e2e8f0" font-weight="600">Tag automatici</text>
  <text x="840" y="749" text-anchor="middle" font-size="10" fill="#64748b">Categorizzazione per tema</text>
  <text x="840" y="762" text-anchor="middle" font-size="10" fill="#64748b">estratta dall'AI · ricerca</text>
  <text x="840" y="775" text-anchor="middle" font-size="10" fill="#64748b">full-text indicizzata</text>

  <!-- Feature 4 -->
  <rect x="990" y="690" width="240" height="100" rx="8" fill="#0f172a" stroke="#1e293b"/>
  <text x="1110" y="712" text-anchor="middle" font-size="20">🔒</text>
  <text x="1110" y="732" text-anchor="middle" font-size="12" fill="#e2e8f0" font-weight="600">Ruoli e permessi</text>
  <text x="1110" y="749" text-anchor="middle" font-size="10" fill="#64748b">Admin · Editor · Redattore</text>
  <text x="1110" y="762" text-anchor="middle" font-size="10" fill="#64748b">Flusso di approvazione</text>
  <text x="1110" y="775" text-anchor="middle" font-size="10" fill="#64748b">configurabile per tipo</text>

  <!-- ════════ Vertical back-arrows ════════ -->
  <!-- Rimanda arrow: review → bozza -->
  <path d="M 720 600 Q 290 620 290 582" stroke="#475569" stroke-width="1.5" fill="none" stroke-dasharray="5 3" marker-end="url(#arrow-ver)" opacity="0.5"/>
  <text x="490" y="617" text-anchor="middle" font-size="10" fill="#475569">← Rimanda in bozza</text>
</svg>
